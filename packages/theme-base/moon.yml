platform: 'bun'

tasks:
  build:
    command: 'bun run build'
    inputs:
      - 'src/**/*'
    outputs:
      - 'dist'
  dev:
    command: 'bun run dev'
    inputs:
      - 'src/**/*'
    local: true
  lint:
    command: 'oxlint --config ../../oxlint.json --ignore-pattern "dist/**" .'
    inputs:
      - 'src/**/*.{ts,tsx}'
  format:
    command: 'oxlint --format --ignore-pattern "dist/**" .'
    inputs:
      - 'src/**/*.{ts,tsx}'
  typecheck:
    command: 'bun run typecheck'
    inputs:
      - 'src/**/*.{ts,tsx}'
      - 'tsconfig.json'
