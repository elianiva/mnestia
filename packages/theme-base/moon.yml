tasks:
  build:
    command: "bun run build"
    inputs:
      - "src/**/*"
    outputs:
      - "dist"
  dev:
    command: "bun run dev"
    inputs:
      - "src/**/*"
  lint:
    command: "bun run lint"
    inputs:
      - "src/**/*.{ts,tsx}"
  format:
    command: "bun run format"
    inputs:
      - "src/**/*.{ts,tsx}"
  typecheck:
    command: "bun run typecheck"
    inputs:
      - "src/**/*.{ts,tsx}"
      - "tsconfig.json"
  install:
    command: "bun install"
    inputs:
      - "package.json"
    outputs:
      - "node_modules"
