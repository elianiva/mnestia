language: typescript
layer: library
toolchains:
  default: 'bun'

tasks:
  install:
    command: 'bun install'
    inputs:
      - 'package.json'
    outputs:
      - 'node_modules'
    options:
      cache: false

  link:
    command: 'bun link'
    description: 'Link package globally for local testing'
    inputs:
      - 'package.json'
