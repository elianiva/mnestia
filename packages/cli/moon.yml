tasks:
  build:
    command: "bun run build"
    inputs:
      - "src/**/*"
    outputs:
      - "dist"
  dev:
    command: "bun run dev"
    inputs:
      - "src/**/*"
  run:
    command: "bun run run"
    inputs:
      - "src/**/*"
  lint:
    command: "bun run lint"
    inputs:
      - "src/**/*.{ts,tsx}"
  format:
    command: "bun run format"
    inputs:
      - "src/**/*.{ts,tsx}"
  typecheck:
    command: "bun run typecheck"
    inputs:
      - "src/**/*.{ts,tsx}"
      - "tsconfig.json"
  test:
    command: "bun run test"
    inputs:
      - "src/**/*"
      - "**/*.test.{ts,tsx}"
  install:
    command: "bun install"
    inputs:
      - "package.json"
    outputs:
      - "node_modules"
