language: typescript
stack: infrastructure
layer: tool
toolchains:
  default: 'bun'

dependsOn:
  - id: 'vite-plugin'
    scope: 'build'

tasks:
  # Build task is auto-detected from package.json "build": "tsdown"

  dev:
    command: 'bun'
    args:
      - '--watch'
      - './src/index.ts'
    inputs:
      - '@group(sources)'
    options:
      persistent: true

  run:
    description: 'Run CLI tool'
    command: 'bun'
    args:
      - './src/index.ts'
    inputs:
      - '@group(sources)'

  install:
    command: 'bun install'
    inputs:
      - 'package.json'
    outputs:
      - 'node_modules'
    options:
      cache: false

  link:
    command: 'bun link'
    description: 'Link package globally for local testing'
    inputs:
      - 'package.json'
