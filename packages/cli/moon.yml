language: typescript
stack: infrastructure
layer: tool
toolchains:
  default: 'bun'

tasks:
  run:
    description: 'Run CLI tool'
    command: 'bun run run'
    inputs:
      - '@group(sources)'

  install:
    command: 'bun install'
    inputs:
      - 'package.json'
    outputs:
      - 'node_modules'
    options:
      cache: false
