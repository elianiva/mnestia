language: typescript
stack: frontend
layer: application
toolchains:
  default: 'bun'

dependsOn:
  - id: 'core'
    scope: 'build'
  - id: 'schema'
    scope: 'build'

tasks:
  # Build task is auto-detected from package.json "build": "vite build"

  preview:
    description: 'Preview production build'
    command: 'pnpm'
    args:
      - 'run'
      - 'preview'
    deps:
      - 'build'
    inputs:
      - 'dist/**/*'
    preset: 'server'

  install:
    command: 'bun install'
    inputs:
      - 'package.json'
    outputs:
      - 'node_modules'
    options:
      cache: false
