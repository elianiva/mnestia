language: typescript
stack: frontend
layer: application
toolchains:
  default: 'bun'

dependsOn:
  - id: 'core'
    scope: 'build'
  - id: 'schema'
    scope: 'build'

tasks:
  build:
    command: 'bun run build'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'vite.config.ts'
    outputs:
      - 'dist'

  preview:
    description: 'Preview production build'
    command: 'bun run preview'
    deps:
      - 'build'
    inputs:
      - 'dist/**/*'
    preset: 'server'

  install:
    command: 'bun install'
    inputs:
      - 'package.json'
    outputs:
      - 'node_modules'
    options:
      cache: false
