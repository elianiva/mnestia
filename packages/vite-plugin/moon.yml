language: typescript
stack: backend
layer: library
toolchains:
  default: 'bun'

dependsOn:
  - id: 'core'
    scope: 'build'
  - id: 'schema'
    scope: 'build'

tasks:
  # Build task is auto-detected from package.json "build": "tsdown"
  # Moon runs: pnpm run build (which executes tsdown)

  dev:
    command: 'pnpm'
    args:
      - 'run'
      - 'dev'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'tsdown.config.ts'
    outputs:
      - 'dist'
    options:
      persistent: true

  install:
    command: 'bun install'
    inputs:
      - 'package.json'
    outputs:
      - 'node_modules'
    options:
      cache: false

  link:
    command: 'bun link'
    description: 'Link package globally for local testing'
    inputs:
      - 'package.json'
