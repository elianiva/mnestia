language: typescript
stack: backend
layer: application
toolchains:
  default: 'bun'

dependsOn:
  - id: 'core'
    scope: 'build'
  - id: 'schema'
    scope: 'build'

tasks:
  # Build task is auto-detected from package.json "build": "tsdown"

  dev:
    command: 'bun'
    args:
      - 'run'
      - '--watch'
      - './src/index.ts'
    inputs:
      - '@group(sources)'
    options:
      persistent: true

  start:
    description: 'Start production server'
    command: 'node'
    args:
      - './bin/server.mjs'
    deps:
      - 'build'
    inputs:
      - 'dist/**/*'
      - 'bin/**/*'
    preset: 'server'

  install:
    command: 'bun install'
    inputs:
      - 'package.json'
    outputs:
      - 'node_modules'
    options:
      cache: false
