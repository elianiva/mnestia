language: typescript
stack: backend
layer: application
toolchains:
  default: 'bun'

dependsOn:
  - id: 'core'
    scope: 'build'
  - id: 'schema'
    scope: 'build'

tasks:
  start:
    description: 'Start production server'
    command: 'bun run start'
    deps:
      - 'build'
    inputs:
      - 'dist/**/*'
    preset: 'server'

  install:
    command: 'bun install'
    inputs:
      - 'package.json'
    outputs:
      - 'node_modules'
    options:
      cache: false
